name: CI
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "samples/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".node-version"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "samples/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".node-version"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build-webview-macos:
    name: Build Native macOS (smoke test)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/webview/target/
          key: cargo-macos-arm64-${{ hashFiles('packages/webview/Cargo.lock') }}
          restore-keys: cargo-macos-arm64-

      - run: pnpm run build
        working-directory: packages/webview

      - name: Check native addon loading
        run: pnpm run test:native
      - name: Build TypeScript packages
        run: pnpm run build:ts
      - name: Lint
        run: pnpm run lint
      - name: Typecheck packages and samples
        run: pnpm exec vp run --filter "./packages/*" --filter "./samples/**" typecheck
      - name: Test packages
        run: pnpm test

  build-webview-windows:
    name: Build Native Windows (smoke test)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/webview/target/
          key: cargo-windows-x64-${{ hashFiles('packages/webview/Cargo.lock') }}
          restore-keys: cargo-windows-x64-

      - run: pnpm run build
        working-directory: packages/webview

      - name: Check native addon loading
        run: pnpm run test:native
      - name: Build TypeScript packages
        run: pnpm run build:ts
      - name: Lint
        run: pnpm run lint
      - name: Typecheck packages and samples
        run: pnpm exec vp run --filter "./packages/*" --filter "./samples/**" typecheck
      - name: Test packages
        run: pnpm test
